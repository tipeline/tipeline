schemaVersion: 4
name: Task Board
description: A Kanban board — drag tasks between columns (or use a card's Move to menu); a workflow saves the move, refuses one it can't allow and the card goes back; click a card for its details
author: tipeline

workflows:
  listTasks: { file: ./workflows/list-tasks.yml }
  moveTask: { file: ./workflows/move-task.yml }

pages:
  - id: board
    name: Board
    icon: SquareKanban

    runnables:
      tasks:
        mode: run
        workflow: listTasks
        trigger: load
        outputs: [tasks]
        persist: false
      move:
        mode: run
        workflow: moveTask
        inputs:
          id: "{= taskBoard.lastMove.card.id =}"
          status: "{= taskBoard.lastMove.to =}"
          index: "{= taskBoard.lastMove.index =}"
        outputs: [task]
        # Saved or not, read the board again: the data decides where the card is.
        onSuccess:
          - { type: run, runnable: tasks }
        onError:
          - { type: toast, variant: error, message: "{{ error.message }}" }
          - { type: run, runnable: tasks }

    components:
      - id: intro
        type: text
        name: Intro
        layout: { x: 0, y: 0, w: 12, h: 10 }
        props:
          markdown: true
          content: "Drag a card to another column or place — or use its **⇄ Move to** menu. A workflow saves the move. Try moving *Translate the pages* to **Doing**: it has no owner, so the workflow refuses and the card goes back."

      - id: taskBoard
        type: kanban
        name: Task board
        layout: { x: 0, y: 10, w: 9, h: 52 }
        props:
          title: Launch plan
          data: "{= runnables.tasks.outputs.tasks =}"
          groupKey: status
          columns:
            - { value: backlog, label: Backlog, color: gray }
            - { value: todo, label: To do, color: blue }
            - { value: doing, label: Doing, color: amber, limit: 2 }
            - { value: done, label: Done, color: green }
          titleKey: title
          colorKey: priority
          colors: { high: red, medium: amber, low: gray }
          fields:
            - { key: owner }
            - { key: due, format: date }
            - { key: priority, format: badge, colors: { high: red, medium: amber, low: gray } }
        events:
          cardMove: [{ type: run, runnable: move }]

      - id: details
        type: keyValue
        name: Task
        layout: { x: 9, y: 10, w: 3, h: 30 }
        props:
          title: "{{ taskBoard.selectedCard.title | default: 'Task' }}"
          data: "{= taskBoard.selectedCard =}"
          emptyText: Click a card
          fields:
            - { key: status, label: Column, format: badge, colors: { backlog: gray, todo: blue, doing: amber, done: green } }
            - { key: owner, label: Owner }
            - { key: due, label: Due, format: date }
            - { key: priority, label: Priority, format: badge, colors: { high: red, medium: amber, low: gray } }

      - id: lastMove
        type: json
        name: Last move
        layout: { x: 9, y: 40, w: 3, h: 22 }
        props:
          title: Last move (taskBoard.lastMove)
          data: "{= taskBoard.lastMove =}"
          expandDepth: 1
          emptyText: Move a card
