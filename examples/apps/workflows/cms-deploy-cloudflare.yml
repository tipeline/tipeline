version: 1.0.0
name: 'CMS: Deploy to Cloudflare'
description: |
  Puts the last HTML export of the CMS (`~/Tipeline/output/cms/site/html`, see CMS: Export Site) live on Cloudflare Pages, with Cloudflare's own tool, Wrangler (`npx wrangler pages deploy`).

  Only the HTML site is uploaded. The project is created on the first deploy. Each deploy is remembered, and the newest is the live one.

  **Needs, once**

  - Node.js on this computer (for `npx`). If a deploy fails with `spawn npx ENOENT`, set `npx` to its full path (`which npx` in a terminal).
  - Global variables `CLOUDFLARE_ACCOUNT_ID` and `CLOUDFLARE_API_TOKEN` (mark the token secret). The token needs the "Cloudflare Pages: Edit" permission.

  **Inputs**

  - `project` — the Pages project: lowercase letters, digits and dashes
  - `npx` — the npx command

  **Outputs**

  - `deployment` — `{ url, project, files }`
author: tipeline
tags: [example, apps, cms, deploy, cloudflare, publish]

pipeline:
  variables:
    - { type: string, name: project, value: '', visibility: public, required: true, description: 'The Pages project, e.g. my-blog.' }
    - { type: string, name: npx, value: npx, visibility: public, description: The npx command (its full path if it isn't found). }
    - { type: object, name: deployment, value: {}, visibility: public, description: The new deployment. Returned to the app. }
    - { type: dbConnection, name: db }
    - { type: array, name: meta, value: [] }
    - { type: object, name: plan, value: {} }
    - { type: array, name: saved, value: [] }

  actions:
    - group: database
      name: connect
      params:
        configuration:
          client: better-sqlite3
          connection: { filename: '{{ _env.HOME }}/Tipeline/output/cms/cms.db' }
          useNullAsDefault: true
      destination: db

    - group: database
      name: query
      params:
        connection: '{= db =}'
        sql: SELECT value FROM meta WHERE key = 'last_html'
      destination: meta

    - group: database
      name: close
      params:
        connection: '{= db =}'

    # A missing global variable comes through as its own reference text.
    - group: script
      name: runScript
      params:
        context:
          meta: '{= meta =}'
          project: '{{ project }}'
          account: '{= _global.CLOUDFLARE_ACCOUNT_ID =}'
          token: '{= _global.CLOUDFLARE_API_TOKEN =}'
        code: |
          const html = meta[0] ? JSON.parse(meta[0].value) : null;
          if (!html || !html.folder) throw new Error('There is no HTML export yet. Export the site with HTML first.');
          const name = String(project).trim().toLowerCase();
          if (!/^[a-z0-9][a-z0-9-]{0,56}[a-z0-9]$/.test(name))
            throw new Error('The project name may only have lowercase letters, digits and dashes, e.g. my-blog.');
          const missing = (v) => typeof v !== 'string' || !v.trim() || v.startsWith('{' + '=');
          if (missing(account) || missing(token))
            throw new Error('Add the global variables CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN (Variables page), then deploy again.');
          return { folder: html.folder, files: html.files || 0, project: name, account: String(account).trim(), token: String(token).trim() };
      destination: plan

    # Creates the project on the first deploy; fails harmlessly when it exists.
    - group: system
      name: runApplication
      onError: continue
      params:
        command: '{{ npx }}'
        args: ['--yes', 'wrangler@4', 'pages', 'project', 'create', '{{ plan.project }}', '--production-branch', 'main']
        env:
          CLOUDFLARE_ACCOUNT_ID: '{{ plan.account }}'
          CLOUDFLARE_API_TOKEN: '{{ plan.token }}'
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'

    - group: system
      name: runApplication
      params:
        command: '{{ npx }}'
        args: ['--yes', 'wrangler@4', 'pages', 'deploy', '{{ plan.folder }}', '--project-name', '{{ plan.project }}', '--branch', 'main', '--commit-dirty=true']
        env:
          CLOUDFLARE_ACCOUNT_ID: '{{ plan.account }}'
          CLOUDFLARE_API_TOKEN: '{{ plan.token }}'
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'

    # Wrangler prints the deployment's address (https://<id>.<project>.pages.dev). Its
    # output is read as _previous: Run Application says it returns an object, so a
    # string variable can't be its destination.
    - group: script
      name: runScript
      params:
        context: { log: '{= _previous =}', plan: '{= plan =}' }
        code: |
          const found = String(log || '').match(/https:\/\/[a-z0-9.-]+\.pages\.dev[^\s"')]*/i);
          return { ...plan, url: found ? found[0] : 'https://' + plan.project + '.pages.dev' };
      destination: plan

    - group: database
      name: connect
      params:
        configuration:
          client: better-sqlite3
          connection: { filename: '{{ _env.HOME }}/Tipeline/output/cms/cms.db' }
          useNullAsDefault: true
      destination: db

    - group: database
      name: query
      params:
        connection: '{= db =}'
        sql: UPDATE deployment SET status = 'replaced' WHERE status = 'live'

    # The deployment's address, from what Wrangler printed (see above).
    - group: database
      name: query
      params:
        connection: '{= db =}'
        sql: >-
          INSERT INTO deployment (at, project, files, url, status)
          VALUES (strftime('%Y-%m-%dT%H:%M:%SZ', 'now'), ?, ?, ?, 'live') RETURNING url, project, files
        bindings: ['{{ plan.project }}', '{= plan.files =}', '{{ plan.url }}']
      destination: saved

    - group: database
      name: close
      params:
        connection: '{= db =}'

    - group: script
      name: runScript
      params:
        context: { saved: '{= saved =}' }
        code: return saved[0];
      destination: deployment
