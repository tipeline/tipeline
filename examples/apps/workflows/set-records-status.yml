version: 1.0.0
name: Set Records Status
description: |
  Gives several records of the example record store (a JSON file in `~/Tipeline/output`) the same status in one go.

  Used by the Records Grid example app's bulk actions.

  **Inputs**

  - `records` — the records to change; only their `id` is used
  - `status` — new status: active, pending or closed

  **Outputs**

  - `count` — how many records changed

  Fails with a clear message for an unknown status or id, and then writes nothing.
author: tipeline
tags: [example, apps, records, status, bulk]

pipeline:
  variables:
    - type: array
      name: records
      value: []
      visibility: public
      description: Records to change (e.g. a table's checked rows). Set by the app.

    - type: string
      name: status
      value: active
      visibility: public
      description: New status — active, pending or closed. Set by the app.

    - type: number
      name: count
      value: 0
      visibility: public
      description: How many records changed. Returned to the app.

    - type: string
      name: raw
      value: ''

    - type: string
      name: updated
      value: ''

    - type: array
      name: seed
      value:
        - { id: 1, name: Acme Corp, status: active, amount: 1200, updatedAt: '2026-09-01T10:00:00Z' }
        - { id: 2, name: Globex, status: pending, amount: 850, updatedAt: '2026-09-12T15:30:00Z' }
        - { id: 3, name: Initech, status: active, amount: 3400, updatedAt: '2026-09-20T09:15:00Z' }
        - { id: 4, name: Umbrella, status: closed, amount: 410, updatedAt: '2026-09-25T18:45:00Z' }
        - { id: 5, name: Soylent, status: pending, amount: 2300, updatedAt: '2026-09-28T11:05:00Z' }
        - { id: 6, name: Hooli, status: active, amount: 990, updatedAt: '2026-10-01T08:20:00Z' }

  actions:
    # The store may not exist yet — keep going with `raw` empty and use the seed.
    - group: file
      name: read
      onError: continue
      params:
        src: '{{ _env.HOME }}/Tipeline/output/app-example-records.json'
      destination: raw

    - group: script
      name: runScript
      params:
        context:
          raw: '{= raw =}'
          seed: '{= seed =}'
          records: '{= records =}'
          status: '{{ status }}'
        code: |
          const STATUSES = ['active', 'pending', 'closed'];
          if (!STATUSES.includes(status)) throw new Error(`Status must be ${STATUSES.join(', ')}`);
          const all = raw ? JSON.parse(raw) : seed;
          const ids = new Set((records ?? []).map((r) => r.id));
          const missing = [...ids].filter((id) => !all.some((r) => r.id === id));
          if (missing.length) throw new Error(`No record with id ${missing.join(', ')}`);
          const now = new Date().toISOString();
          return JSON.stringify(
            all.map((r) => (ids.has(r.id) ? { ...r, status, updatedAt: now } : r)),
            null,
            2
          );
      destination: updated

    - group: file
      name: write
      params:
        src: '{{ _env.HOME }}/Tipeline/output/app-example-records.json'
        data: '{= updated =}'

    - group: script
      name: runScript
      params:
        context:
          records: '{= records =}'
        code: return (records ?? []).length;
      destination: count

    - group: system
      name: message
      params:
        text: '{{ count }} record(s) set to {{ status }}.'
