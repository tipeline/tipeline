version: 1.0.0
name: 'CMS: Delete Field'
description: |
  Deletes a field from a content type of the CMS store (`~/Tipeline/output/cms/cms.db`), together with its values in that type's content (as Drupal does). This can't be undone; older revisions keep their copy.

  **Inputs**

  - `type` — the content type
  - `name` — the field's machine name

  **Outputs**

  - `field` — `{ name, label }`
author: tipeline
tags: [example, apps, cms, fields, delete]

pipeline:
  variables:
    - { type: string, name: type, value: '', visibility: public, required: true, description: The content type. }
    - { type: string, name: name, value: '', visibility: public, required: true, description: The field. }
    - { type: object, name: field, value: {}, visibility: public, description: The deleted field. Returned to the app. }
    - { type: dbConnection, name: db }
    - { type: array, name: deleted, value: [] }

  actions:
    - group: database
      name: connect
      params:
        configuration:
          client: better-sqlite3
          connection: { filename: '{{ _env.HOME }}/Tipeline/output/cms/cms.db' }
          useNullAsDefault: true
      destination: db

    - group: database
      name: query
      params:
        connection: '{= db =}'
        sql: DELETE FROM field WHERE type_id = ? AND name = ? RETURNING name, label
        bindings: ['{{ type }}', '{{ name }}']
      destination: deleted

    - group: database
      name: query
      params:
        connection: '{= db =}'
        sql: UPDATE node SET fields = json_remove(fields, '$.' || ?) WHERE type = ?
        bindings: ['{{ name }}', '{{ type }}']

    - group: database
      name: close
      params:
        connection: '{= db =}'

    - group: script
      name: runScript
      params:
        context: { deleted: '{= deleted =}', name: '{{ name }}' }
        code: |
          if (!deleted.length) throw new Error('The field ' + name + ' was not found.');
          return deleted[0];
      destination: field
