version: 1.0.0
name: Check Disk Space
description: |
  Shows how full the disks are on a server, using `df -h` over SSH. Returns the `df` table as text.
author: Tipeline Examples
tags: [server, disk, storage, df, ssh]

pipeline:
  variables:
    - type: string
      name: server
      label: Server
      description: The server's SSH host name, e.g. web-01
      required: true
      value: ''
      visibility: public

    - type: string
      name: usage
      label: Disk usage
      description: The `df -h` table for the server.
      value: ''
      visibility: public
      output: true

  actions:
    - group: system
      name: runApplication
      label: Read disk usage
      params:
        command: ssh
        args:
          - '{{ server }}'
          - df -h
      destination: usage
