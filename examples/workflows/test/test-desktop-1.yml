      params:
        timeout: 1000

    - group: system
      name: message
      params:
        text: This is message 8. {{ hello }}
    - group: flow
      name: wait
      params:
        timeout: 1000

    - group: system
      name: message
      params:
        text: This is message 9. {{ hello }}
    - group: flow
      name: wait
      params:
        timeout: 1000

    - group: system
      name: message
      params:
        text: This is message 10. {{ hello }}
    - group: flow
      name: wait
      params:
        timeout: 1000
