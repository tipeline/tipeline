version: 1.0.0
name: Test Block Database
description: |
  Prints a message, loops over 3 fruits with a 4-pass simple loop inside each, then prints a last message. Use it to check how nested loops are saved as blocks in a run's history.

  The blocks are stored in the `pipeline_block` table.
author: Jose Daniel Estrada
tags: [example, loop, run history, blocks]

pipeline:
  variables:
    - type: string
      name: greeting
      value: Hello from Main Task

    - type: number
      name: counter
      value: 0

    - type: boolean
      name: isReady
      value: true

    - type: array
      name: fruits
      value: [apple, banana, cherry]

    - type: string
      name: currentFruit
      value: ''

  actions:
    - group: system
      name: message
      params:
        text: |
          Message from Action #0

    # Walks the fruits array; each item is bound to currentFruit before the body runs
    - group: flow
      name: forEachLoop
      params:
        iterable: '{= fruits =}'
        currentItem: currentFruit
        actions:
          - group: system
            name: message
            params:
              text: |
                forEachLoop → current fruit: {{ currentFruit }}
          # Runs the body 4 times: i = 1, 3, 5, 7 (step 2, stop before 8)
          - group: flow
            name: simpleLoop
            params:
              indexValue: 1
              indexEndValue: 8
              incrementBy: 2
              actions:
                - group: system
                  name: message
                  params:
                    text: |
                      simpleLoop → iteration

    - group: system
      name: message
      params:
        text: |
          Message from Action #2
