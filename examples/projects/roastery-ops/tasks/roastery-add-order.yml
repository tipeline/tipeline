version: 1.0.0
name: 'Roastery: Add Order'
description: |
  Takes an order: checks there is enough roasted coffee, saves the order as **New** and takes the coffee out of stock. The price comes from the coffee's price per kg.

  **Inputs**

  - `customer` — who ordered
  - `channel` — `web`, `cafe` or `wholesale`
  - `beanId` — the coffee
  - `kg` — how much, more than 0

  **Outputs**

  - `order` — `{ id, customer, bean, kg, total }`
author: Jose Daniel Estrada
tags: [roastery, orders, sqlite]

pipeline:
  variables:
    - { type: string, name: customer, value: '', visibility: public, required: true, description: Who ordered. }
    - { type: string, name: channel, value: web, visibility: public, description: web, cafe or wholesale. }
    - { type: number, name: beanId, value: 0, visibility: public, required: true, description: The coffee ordered. }
    - { type: number, name: kg, value: 1, visibility: public, required: true, description: How much, in kg. }
    - { type: object, name: order, value: {}, visibility: public, output: true, description: The saved order. }
    - { type: dbConnection, name: db }
    - { type: object, name: input, value: {} }
    - { type: array, name: beanRows, value: [] }
    - { type: array, name: saved, value: [] }

  actions:
    - group: script
      identifier: axgMWcP5nVn6v23l2rDT2
      name: runScript
      params:
        context: { customer: '{{ customer }}', channel: '{{ channel }}', beanId: '{= beanId =}', kg: '{= kg =}' }
        code: |
          const name = customer.trim();
          if (!name) throw new Error('Who is the order for?');
          if (!['web', 'cafe', 'wholesale'].includes(channel)) throw new Error('Channel must be web, cafe or wholesale');
          const id = Number(beanId);
          if (!Number.isInteger(id) || id < 1) throw new Error('Pick a coffee');
          const weight = Math.round(Number(kg) * 100) / 100;
          if (!(weight > 0)) throw new Error('Order at least a little coffee');
          return { customer: name, channel, id, kg: weight };
      destination: input

    - group: database
      identifier: VSAEpmkDIWkQnlwRurKYr
      name: connect
      params:
        configuration:
          client: better-sqlite3
          connection: { filename: '{{ _env.HOME }}/Tipeline/output/roastery/roastery.db' }
          useNullAsDefault: true
      destination: db

    - group: database
      identifier: 7Ze3ASryGjjR2e-xYp654
      name: query
      params:
        connection: '{= db =}'
        sql: SELECT id, name, price_per_kg, stock_kg FROM bean WHERE id = ?
        bindings: ['{= input.id =}']
      destination: beanRows

    - group: script
      identifier: EtHo-I26yUL4cFYMCfwrZ
      name: runScript
      params:
        context: { beanRows: '{= beanRows =}', input: '{= input =}' }
        code: |
          const bean = beanRows[0];
          if (!bean) throw new Error('That coffee is not in the store');
          if (bean.stock_kg < input.kg) throw new Error(`Only ${bean.stock_kg} kg of ${bean.name} left — record a roast first`);
          return { ...input, bean: bean.name, total: Math.round(input.kg * bean.price_per_kg * 100) / 100 };
      destination: input

    - group: database
      identifier: 0O1NTJJjXPl1uT814rGNU
      name: query
      params:
        connection: '{= db =}'
        sql: >-
          INSERT INTO orders (customer, channel, bean_id, kg, total, status, created_at)
          VALUES (?, ?, ?, ?, ?, 'new', strftime('%Y-%m-%dT%H:%M:%SZ', 'now')) RETURNING id
        bindings: ['{{ input.customer }}', '{{ input.channel }}', '{= input.id =}', '{= input.kg =}', '{= input.total =}']
      destination: saved

    - group: database
      identifier: Nxn7tqbBJQLzUHJq95vL1
      name: query
      params:
        connection: '{= db =}'
        sql: UPDATE bean SET stock_kg = ROUND(stock_kg - ?, 2) WHERE id = ?
        bindings: ['{= input.kg =}', '{= input.id =}']

    - group: database
      identifier: J8fTyupRTk6y6q8keBLWC
      name: close
      params:
        connection: '{= db =}'

    - group: script
      identifier: 2uDL8t-3RWn8jrmQnk7TK
      name: runScript
      params:
        context: { saved: '{= saved =}', input: '{= input =}' }
        code: |
          return { id: saved[0].id, customer: input.customer, bean: input.bean, kg: input.kg, total: input.total };
      destination: order
