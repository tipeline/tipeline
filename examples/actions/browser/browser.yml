version: 1.0.0
name: Browser — all functions
description: |
  Runs the browser example files one after another as sub-workflows. `control.yml` and `cookies.yml` are on; the steps for `navigation.yml`, `elements.yml`, `content.yml`, `interactions.yml` and `transfer.yml` are commented out, ready to turn on.
author: Jose Daniel Estrada
tags: [example, browser, automation]
pipeline:
  variables: []
  actions:
    - group: subtask
      name: exec
      params:
        host: local
        path: './control.yml'

