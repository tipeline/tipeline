version: 1.0.0
name: Sub-workflow Child Workflow
description: |
  The child workflow that `subworkflow.yml` calls. It takes `rawInput` from the parent, changes it and exposes `processedResult` and `itemCount` for the parent to read.

author: Jose Daniel Estrada
tags: [example, sub-workflow]

pipeline:
  variables:
    # Populated by the parent via props before this workflow runs
    - type: string
      name: rawInput
      visibility: public
      value: ''

    # Computed inside this workflow; exported back to the parent via outputs
    - type: string
      name: processedResult
      visibility: public
      output: true
      value: ''

    - type: number
      name: itemCount
      visibility: public
      output: true
      value: 0

  actions:
    # Transform the injected input — uppercase it and store in processedResult
    - group: string
      name: toUpperCase
      params:
        string: '{{ rawInput }}'
      destination: processedResult

    # Set a numeric output the parent can read back
    - group: variable
      name: set
      params:
        name: itemCount
        value: 42

    # Log what this child computed before it exits
    - group: system
      name: message
      params:
        text: |
          [child] rawInput       : {{ rawInput }}
          [child] processedResult: {{ processedResult }}
          [child] itemCount      : {{ itemCount }}
