name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # A clean install builds the shared packages, so a broken prepare fails here.
      - run: npm ci
      - run: node scripts/set-version.mjs --check
      - run: npm run build
      - run: npm test
      - run: npx vue-tsc --noEmit
        working-directory: apps/desktop
      - run: npm -w apps/docs run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - docker/distributed/Dockerfile
          - docker/websockets/Dockerfile
          - apps/server/resources/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f ${{ matrix.dockerfile }} .
