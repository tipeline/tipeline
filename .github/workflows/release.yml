# Builds the Mac installers and, if asked, publishes to npm. Run by hand from the Actions tab:
# nothing here starts on its own. See RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Also publish the packages to npm
        type: boolean
        default: false
  # Once releases are routine, a version tag can start this instead:
  # push:
  #   tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/set-version.mjs --check
      - id: version
        run: echo "version=$(node -p "require('./apps/core/package.json').version")" >> "$GITHUB_OUTPUT"
      # npm can't take a publish back, so this only runs on exactly what was tagged.
      - name: Check this commit is tagged with its version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$(git rev-list -n 1 "v$VERSION" 2>/dev/null)" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA isn't tagged v$VERSION. Set the version, commit, tag and push first."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test

  mac:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Native modules only match the machine that built them, so each architecture needs its own.
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm -w apps/desktop run build -- --publish never
        env:
          # Unsigned for now. Once there's an Apple Developer ID, delete this line, set
          # "notarize": true in electron-builder.json5, and uncomment the rest.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          # APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          # APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*/*.dmg
            apps/desktop/release/*/*.zip
            apps/desktop/release/*/*.blockmap
            apps/desktop/release/*/latest-mac.yml

  draft-release:
    needs: [check, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge the update files of both architectures
        run: node scripts/merge-mac-update-files.mjs latest-mac.yml artifacts/mac-*/*/latest-mac.yml
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          rm artifacts/mac-*/*/latest-mac.yml
          gh release create "v$VERSION" --draft --generate-notes --verify-tag \
            --title "Tipeline $VERSION" latest-mac.yml artifacts/mac-*/*/*

  npm:
    needs: [check, mac, draft-release]
    if: inputs.publish_npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: no token to store. Set each package up on npmjs.com first.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: node scripts/publish-npm.mjs
