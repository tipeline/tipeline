name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/tipeline/tipeline/blob/main/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          # Signatures are committed to this branch; create it once and don't protect it.
          branch: 'cla-signatures'
          # Maintainers and bots don't sign. Add GitHub usernames here, comma separated,
          # including employees of companies that signed CLA-CORPORATE.md.
          allowlist: 'jdeg,dependabot[bot],github-actions[bot]'
